name: Editorial word count
on:
  push:
    branches:
      - agent/integrate-structural-review-controls
jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Count drafted manuscript prose
        run: python scripts/word_count.py
